{% extends "base.html" %}

{% block content %}
<form class="form-card" method="post" novalidate>
    {% csrf_token %}<div class="form-card-head"><h2>{{ page_title }}</h2><p>مبالغ را به تومان و درصد پیشرفت را بین صفر تا صد وارد کنید.</p></div>
    <div class="form-card-body">{% include "partials/form_fields.html" %}</div>
    <div class="form-card-foot"><a class="btn" href="{% if project %}{% url 'projects:detail' project.pk %}{% else %}{% url 'projects:list' %}{% endif %}">انصراف</a><button class="btn btn--primary" type="submit">{{ submit_label }}</button></div>
</form>
{% endblock %}
